# Two services: the merged fine-tuned model behind vLLM (OpenAI-compatible), and the app. Not built or tested here.
# Set the model URL in the app's settings to http://llm:8000/v1 and the model name to sme-drhp-7b.
services:
  llm:
    image: vllm/vllm-openai:v0.10.0
    command: ["--model", "/models/A_qa_dpo_merged", "--served-model-name", "sme-drhp-7b", "--max-model-len", "6144", "--gpu-memory-utilization", "0.85"]
    volumes:
      - ./models:/models:ro
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  app:
    build: {context: .., dockerfile: docker/Dockerfile.app}
    ports: ["8765:8765"]
    volumes:
      - ./workspace:/app/workspace
    depends_on: [llm]
